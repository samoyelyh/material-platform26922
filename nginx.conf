# ============================================================================
# material-platform 前端 Nginx 配置（生产）
#
#  - 静态托管 dist（Vite build 产物）
#  - SPA fallback：React Router 深层路由刷新不 404
#  - /api/ 同源反向代理 → mp-backend（Docker 网络内部端口 8020）
#  - 大文件上传 / ZIP 下载透传，不设过小限制
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- SPA fallback（React Router history 路由） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 同源反向代理（浏览器只访问本前端端口，不直连后端） ----------
    # 后端容器内实际监听 8020（compose service 名 backend，网络 DNS 内可解析）
    location /api/ {
        proxy_pass http://backend:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传限制：VariantEffectImage / Asset / PSD（后端 MAX_UPLOAD_SIZE_BYTES=200MB）
        client_max_body_size 512m;
        client_body_timeout 600s;

        # 大文件 / ZIP 下载透传：不缓冲、长超时
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # ---------- 静态资源缓存（Vite 产物带内容 hash，可长缓存） ----------
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
